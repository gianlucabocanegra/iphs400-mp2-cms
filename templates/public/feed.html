{% extends "base.html" %}
{% block content %}
  <h1>{{ heading }}</h1>
  {% if items %}
    <ul>{% for item in items %}
      <li><a href="{{ item.href }}">{{ item.title }}</a>{% if item.date %} <small>{{ item.date }}</small>{% endif %}</li>
    {% endfor %}</ul>
  {% else %}
    <p>Aún no hay publicaciones.</p>
  {% endif %}
{% endblock %}
