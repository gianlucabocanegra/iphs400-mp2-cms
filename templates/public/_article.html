  <article>
    {% if event_label %}<p><strong>{{ event_label }}</strong></p>{% endif %}
    {% if kind_label or date_label %}<p><small>{{ kind_label }}{% if kind_label and date_label %} · {% endif %}{{ date_label }}</small></p>{% endif %}
    <h1>{{ post.title }}</h1>
    {{ body_html | safe }}
  </article>
