{% extends "base.html" %}
{% block content %}
  <section>
    <h1>Últimas noticias</h1>
    {% if news %}
      <ul>{% for item in news %}
        <li><a href="{{ item.href }}">{{ item.title }}</a> <small>{{ item.date }}</small></li>
      {% endfor %}</ul>
    {% else %}
      <p>Aún no hay noticias publicadas.</p>
    {% endif %}
  </section>
{% endblock %}
